<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>背景削除ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><h1>BACKGROUND REMOVER</h1><p>- 背景透過ツール -</p></header>
  <main>
    <section id="upload-section">
      <h2 class="upload-heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>1. 画像を選択</h2>
      <div id="dropzone" class="upload">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
        <p class="upload-text">クリックして画像ファイルを選択</p>
        <p class="upload-subtext">または、ここにドラッグ＆ドロップ（PNG / JPG）</p>
        <div id="upload-preview-wrap" hidden><div class="upload-preview-inner"><img id="upload-preview" alt="アップロード画像のサムネイル"></div></div>
        <input id="file" type="file" accept="image/*" style="display:none">
      </div>
    </section>
    <section class="layout-section">
      <h2 class="step-heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>2. 背景色を指定</h2>
      <p id="original-status" role="status" aria-live="polite"></p>
      <div class="settings">
        <label>消す背景色<span class="color-row"><input id="color" type="color" value="#5aff19" aria-label="背景色を選択"><input id="hex" type="text" value="#5AFF19" maxlength="7" pattern="#[0-9a-fA-F]{6}" aria-label="背景色のカラーコード" spellcheck="false"></span></label>
      </div>
      <div id="original-preview-panel" class="previews" hidden>
        <div><h3>元画像</h3><div class="canvas-wrap"><canvas id="original" aria-label="元画像。背景をクリックして色を選択"></canvas></div></div>
      </div>
    </section>
    <section class="layout-section">
      <div class="heading-row"><h2 class="step-heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19 3 3v-5.5"/><path d="m17 22 3-3"/><circle cx="9" cy="9" r="2"/></svg>3. 確認して保存</h2><label>確認用の背景 <select id="preview-bg"><option value="checker">市松模様</option><option value="white">白</option><option value="dark">黒</option></select></label></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="result-preview-panel" class="previews" hidden>
        <div><h3>透過後</h3><div id="result-wrap" class="canvas-wrap checker"><canvas id="result" aria-label="背景を除去した画像"></canvas></div></div>
      </div>
      <button id="save" type="button" disabled>透過PNGを保存</button>
    </section>
  </main>
  <footer>© 2026 深森呼吸</footer>
</body>
</html>
